---
- name: Clone or update the app repository
  ansible.builtin.git:
    repo: https://github.com/hadyatotakhail08-web/expense-tracker.git
    dest: "{{ app_dir }}"
    version: main

- name: Deploy the systemd unit
  ansible.builtin.template:
    src: expense-tracker.service.j2
    dest: /etc/systemd/system/expense-tracker.service
    mode: "0644"
  notify: Restart app service

- name: Deploy the nginx reverse proxy config
  ansible.builtin.template:
    src: nginx-expense-tracker.j2
    dest: /etc/nginx/sites-available/expense-tracker
    mode: "0644"
  notify: Restart nginx

- name: Enable the app site in nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/expense-tracker
    dest: /etc/nginx/sites-enabled/expense-tracker
    state: link

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Enable and start the app service
  ansible.builtin.systemd:
    name: expense-tracker
    enabled: true
    state: started
    daemon_reload: true
